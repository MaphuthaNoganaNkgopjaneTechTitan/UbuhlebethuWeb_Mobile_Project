name: UbuhleBethu ConnectPro CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy WebApp to production after successful build & test'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: .NET Solution Build, Test & Package (.NET 10)
  # ─────────────────────────────────────────────────────────────────────────────
  dotnet-ci:
    name: .NET 10 Solution (API, WebApp, Tests)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: |
          dotnet restore "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhlebethuConnectPro.sln" --verbosity normal

      - name: Build Solution (Release)
        run: |
          dotnet build "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhlebethuConnectPro.sln" --configuration Release --no-restore

      - name: Run Automated Test Suite (32 Tests + Code Coverage)
        run: |
          dotnet test "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhlebethuConnectPro.Tests/UbuhlebethuConnectPro.Tests.csproj" `
            --configuration Release `
            --no-build `
            --verbosity normal `
            --collect:"XPlat Code Coverage" `
            --results-directory ./TestResults `
            --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./TestResults
          retention-days: 14

      - name: Publish Web API Package
        run: |
          dotnet publish "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhlebethuConnectPro.Api/UbuhlebethuConnectPro.Api.csproj" `
            --configuration Release `
            --output ./artifacts/api `
            --no-build

      - name: Publish WebApp Package
        run: |
          dotnet publish "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhleBethu-WebApp/UbuhlebethuConnectPro.WebApp.csproj" `
            --configuration Release `
            --output ./artifacts/webapp `
            --no-build

      - name: Upload Published Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-web-artifacts
          path: ./artifacts
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Android Mobile App Build & Test (Kotlin / Gradle 9.4.1)
  # ─────────────────────────────────────────────────────────────────────────────
  android-ci:
    name: Android Mobile App (Gradle & APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: 'UbuhleBethu ConnectPro/Ubuhlebethu-Mobile/UbuhlebethuMApp'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x "UbuhleBethu ConnectPro/Ubuhlebethu-Mobile/UbuhlebethuMApp/gradlew"

      - name: Run Unit Tests
        run: |
          cd "UbuhleBethu ConnectPro/Ubuhlebethu-Mobile/UbuhlebethuMApp"
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          cd "UbuhleBethu ConnectPro/Ubuhlebethu-Mobile/UbuhlebethuMApp"
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: connectpro-mobile-debug-apk
          path: "UbuhleBethu ConnectPro/Ubuhlebethu-Mobile/UbuhlebethuMApp/app/build/outputs/apk/debug/*.apk"
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Security & Vulnerability Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit NuGet Package Vulnerabilities
        run: |
          dotnet list "UbuhleBethu ConnectPro/Ubuhlebethu-Web/UbuhlebethuConnectPro.sln" package --vulnerable --include-transitive || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Automated Continuous Deployment (CD to Production)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Continuous Deployment (Production WebDeploy)
    needs: [dotnet-ci, android-ci]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true)
    runs-on: windows-latest
    environment:
      name: production
      url: http://ubuhlebethuconnectpro.runasp.net

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Published Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: published-web-artifacts
          path: ./artifacts

      - name: Deploy WebApp via MSDeploy / WebDeploy
        shell: powershell
        run: |
          $publishPassword = "${{ secrets.WEBDEPLOY_PASSWORD }}"
          $publishUser = "${{ secrets.WEBDEPLOY_USERNAME }}"
          $publishServer = "${{ secrets.WEBDEPLOY_SERVER }}"
          $siteName = "${{ secrets.WEBDEPLOY_SITENAME }}"
          
          if ([string]::IsNullOrWhiteSpace($publishPassword) -or [string]::IsNullOrWhiteSpace($publishUser)) {
            Write-Host "::notice::WebDeploy credentials not configured in GitHub Secrets. Skipping remote deployment."
            Write-Host "To enable automated production deployments, configure repository secrets: WEBDEPLOY_USERNAME, WEBDEPLOY_PASSWORD, WEBDEPLOY_SERVER, WEBDEPLOY_SITENAME."
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($publishServer)) { $publishServer = "site95142.siteasp.net" }
          if ([string]::IsNullOrWhiteSpace($siteName)) { $siteName = "site95142" }

          Write-Host "Initiating WebDeploy to $publishServer for site $siteName..."
          $msdeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeployPath)) {
            $msdeployPath = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          if (Test-Path $msdeployPath) {
            & $msdeployPath -verb:sync `
              -source:contentPath="$(Get-Location)\artifacts\webapp" `
              -dest:contentPath="$siteName",computerName="https://$($publishServer):8172/msdeploy.axd?site=$siteName",userName="$publishUser",password="$publishPassword",authtype="Basic" `
              -allowUntrusted `
              -enableRule:AppOffline
            Write-Host "Deployment completed successfully."
          } else {
            Write-Warning "msdeploy.exe not located on runner. Packaging zip artifact for release."
          }
