# Local full-stack run:  cp .env.example .env  (fill in values)  then  docker compose up --build
# Web: http://localhost:5000   API: http://localhost:5001/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connectpro
      POSTGRES_USER: connectpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectpro -d connectpro"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: Host=db;Database=connectpro;Username=connectpro;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY (32+ characters) in .env}
      Seed__DemoUsers: "true"
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in .env}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.WebApp
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    depends_on:
      - api

volumes:
  dbdata:
