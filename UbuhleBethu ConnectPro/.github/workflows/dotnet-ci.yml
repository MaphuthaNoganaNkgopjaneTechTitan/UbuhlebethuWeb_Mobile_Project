name: .NET Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Ubuhlebethu-Web

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage"
      
    - name: Docker Build WebApp
      run: docker build -t ubuhlebethu-webapp -f UbuhleBethu-WebApp/Dockerfile .
      
    - name: Docker Build API
      run: docker build -t ubuhlebethu-api -f UbuhlebethuConnectPro.Api/Dockerfile .
